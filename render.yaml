services:
  # ── Traffic Monitor Web Service ──────────────────────────────────────────────
  - type: web
    name: ai-trading-monitor
    env: python
    region: frankfurt          # Choose closest to your users
    plan: free                 # Free tier (spins down after 15min inactivity)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_traffic_monitor:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGODB_URI
        sync: false # Set this value in the Render Dashboard
      - key: MONITOR_PASSWORD
        sync: false # Set a password to protect the dashboard (leave unset = open access)
      - key: PYTHON_VERSION
        value: "3.11.0"
